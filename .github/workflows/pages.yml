name: Build and deploy Hugo blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Hugo version
        run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"
      - name: Install Hugo
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" "$release/$archive"
          curl --fail --location --retry 3 --output checksums.txt "$release/hugo_${HUGO_VERSION}_checksums.txt"
          awk -v name="$archive" '$2 == name {print; found=1} END {if (!found) exit 1}' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          hugo build --gc --minify --panicOnWarning --baseURL "${PAGES_BASE_URL:-https://example.org}/" --cacheDir "$RUNNER_TEMP/hugo-cache"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
